<style>
.demo{--accent:#8b5cf6;max-width:680px;margin:8px 0;font-family:inherit}.demo *{box-sizing:border-box}.preview{position:relative;overflow:hidden;border-radius:16px;padding:28px;background:#101629;color:#f4f5ff;min-height:185px;display:flex;align-items:center;gap:24px}.orb{width:118px;height:118px;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff8,var(--accent) 45%,#182340 80%);box-shadow:0 0 65px color-mix(in srgb,var(--accent) 45%,transparent);transition:background .3s,box-shadow .3s}.eyebrow{font-size:11px;letter-spacing:2px;color:#c2c7e0;text-transform:uppercase;margin-bottom:8px}.sample{font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-1px}.sub{font-size:13px;color:#b7bfd9;margin-top:10px;line-height:1.5}.badge{display:inline-block;margin-top:14px;border:1px solid #ffffff30;border-radius:20px;padding:4px 10px;color:#dddff0;font-size:11px}.controls{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:18px 0 12px;flex-wrap:wrap}.swatches{display:flex;gap:9px}.swatch{width:32px;height:32px;min-height:0!important;padding:0!important;border-radius:50%!important;background:var(--c)!important;border:3px solid transparent!important;box-shadow:0 0 0 1px #8884;cursor:pointer}.swatch[aria-pressed=true]{border-color:white!important;box-shadow:0 0 0 2px var(--c)}.slider{display:flex;align-items:center;gap:10px;font-size:12px}.slider input{width:105px;accent-color:var(--accent)}.codes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chip{border:1px solid #8883;border-radius:9px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:12px}.dot{width:12px;height:12px;border-radius:4px;background:var(--accent)}.chip small{display:block;opacity:.65;font-size:10px;margin-bottom:3px}.chip code{font-size:11px}.darkdot{background:#101629}.lightdot{background:#f4f5ff;border:1px solid #8884}@media(max-width:460px){.preview{padding:20px;gap:16px}.orb{width:80px;height:80px}.sample{font-size:24px}.chip{padding:8px}.codes{gap:5px}}
</style>
<div class="demo" id="palette-demo">
<div class="preview"><div class="orb" id="orb"></div><div><div class="eyebrow">Live color studio</div><div class="sample">A little color.<br>A lot of possibility.</div><div class="sub">Pick a hue. Shape the glow. See it change.</div><span class="badge" id="palette-label">Violet · Creative & calm</span></div></div>
<div class="controls"><div class="swatches" role="group" aria-label="Accent color"><button class="swatch" style="--c:#8b5cf6" aria-label="Violet" aria-pressed="true" data-color="#8b5cf6" data-label="Violet · Creative & calm"></button><button class="swatch" style="--c:#38bdf8" aria-label="Sky" aria-pressed="false" data-color="#38bdf8" data-label="Sky · Clear & open"></button><button class="swatch" style="--c:#2dd4bf" aria-label="Mint" aria-pressed="false" data-color="#2dd4bf" data-label="Mint · Fresh & balanced"></button><button class="swatch" style="--c:#fb7185" aria-label="Rose" aria-pressed="false" data-color="#fb7185" data-label="Rose · Warm & playful"></button><button class="swatch" style="--c:#fbbf24" aria-label="Amber" aria-pressed="false" data-color="#fbbf24" data-label="Amber · Bright & bold"></button></div><label class="slider">Glow <input id="glow" type="range" min="0" max="100" value="65"><output id="glow-value">65%</output></label></div>
<div class="codes"><div class="chip"><span class="dot"></span><div><small>ACCENT</small><code id="hex">#8B5CF6</code></div></div><div class="chip"><span class="dot darkdot"></span><div><small>SURFACE</small><code>#101629</code></div></div><div class="chip"><span class="dot lightdot"></span><div><small>TEXT</small><code>#F4F5FF</code></div></div></div>
</div>
<script>
const root=document.getElementById('palette-demo'),orb=document.getElementById('orb'),glow=document.getElementById('glow');let color='#8b5cf6';function updateGlow(){orb.style.boxShadow='0 0 '+glow.value+'px '+color+'73';document.getElementById('glow-value').textContent=glow.value+'%'}root.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{color=b.dataset.color;root.style.setProperty('--accent',color);root.querySelectorAll('.swatch').forEach(s=>s.setAttribute('aria-pressed',String(s===b)));document.getElementById('hex').textContent=color.toUpperCase();document.getElementById('palette-label').textContent=b.dataset.label;updateGlow()}));glow.addEventListener('input',updateGlow);
</script>
