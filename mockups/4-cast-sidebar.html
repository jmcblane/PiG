<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PiG — Cast with inbox</title>
<style>
  :root {
    --bg: #262036;
    --side: #211b30;
    --panel: #2f2843;
    --raise: #3a3152;
    --line: #433a58;
    --ink: #f1ecf8;
    --ink-2: #c0b6d3;
    --ink-3: #948aa9;
    --peach: #ffb38a;
    --mint: #8fe3c4;
    --rose: #ff8fae;
    --ui: -apple-system, "SF Pro Text", system-ui, sans-serif;
    --mono: "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14101d; color: var(--ink); font: 14px/1.5 var(--ui); }
  body { display: grid; place-items: center; padding: 24px; }

  .win {
    width: min(1320px, 100%); height: min(860px, calc(100vh - 48px));
    border-radius: 12px; overflow: hidden; position: relative;
    display: grid; grid-template-columns: var(--side-w, 280px) 1fr; grid-template-rows: 44px 1fr;
    background:
      radial-gradient(900px 520px at 60% -12%, rgba(255,179,138,.13), transparent 60%),
      radial-gradient(700px 520px at 100% 100%, rgba(143,227,196,.06), transparent 60%),
      var(--bg);
    box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 40px 90px -30px rgba(0,0,0,.8);
    transition: grid-template-columns .22s cubic-bezier(.3,.7,.2,1);
  }
  .win.collapsed { --side-w: 0px; }

  /* top bar */
  .top { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 12px; }
  .left, .right { display: flex; align-items: center; gap: 4px; }
  .right { justify-content: flex-end; }
  .lights { display: flex; gap: 8px; margin-right: 14px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .ib { width: 28px; height: 26px; border: 0; background: none; color: var(--ink-2); border-radius: 6px; display: grid; place-items: center; cursor: pointer; }
  .ib:hover { background: rgba(255,255,255,.06); color: var(--ink); }
  .ib.on { color: var(--peach); }
  .ib svg { width: 16px; height: 16px; }
  .room { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12.5px; font-weight: 500; padding: 4px 6px; border-radius: 6px; cursor: pointer; margin-left: 2px; }
  .room:hover { color: var(--ink); background: rgba(255,255,255,.05); }
  .room svg.chev { width: 8px; height: 8px; color: var(--ink-3); }
  .title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; max-width: 520px; }
  .title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title .ic { width: 18px; height: 18px; flex: none; }

  /* inbox */
  .inbox { background: #221c31; border-right: 1px solid rgba(255,255,255,.05); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .inbox-inner { width: 280px; display: flex; flex-direction: column; min-height: 0; height: 100%; }
  .new { margin: 6px 10px 6px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--ink-2); font-size: 13px; cursor: pointer; border: 0; background: none; font-family: inherit; text-align: left; }
  .new:hover { background: rgba(255,255,255,.05); color: var(--ink); }
  .new .plus { width: 28px; height: 28px; border-radius: 8px; border: 1.2px dashed var(--ink-3); display: grid; place-items: center; }
  .new kbd { margin-left: auto; font: 11px var(--ui); color: var(--ink-3); }
  .list { flex: 1; overflow-y: auto; padding: 2px 8px 8px; }

  .row { position: relative; border-radius: 9px; overflow: hidden; margin-bottom: 2px; user-select: none; }
  .row .done-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 16px; gap: 6px;
    background: rgba(143,227,196,.14); color: var(--mint); font-size: 12px; font-weight: 600; }
  .row.commit .done-bg { background: var(--mint); color: #1d2a24; }
  .face { position: relative; display: grid; grid-template-columns: 30px 1fr 22px; gap: 10px; align-items: center; padding: 8px 8px 8px 9px; background: var(--bg); cursor: pointer; transition: transform .18s ease-out, background .1s; }
  .list .row .face { background: #221c31; }
  .row:hover .face { background: #2c2540; }
  .row.sel .face { background: #3a3152; }
  .row.sel .face::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2.5px; border-radius: 2px; background: var(--peach); }
  .row.child .face { grid-template-columns: 22px 1fr 22px; padding-left: 30px; }
  .row.dragging { opacity: .4; }
  .row.drop-before { box-shadow: inset 0 2px 0 var(--peach); }
  .row.drop-after { box-shadow: inset 0 -2px 0 var(--peach); }
  .ic { width: 30px; height: 30px; border-radius: 8px; overflow: hidden; display: block; }
  .row.child .ic { width: 22px; height: 22px; border-radius: 6px; }
  .t { min-width: 0; }
  .t b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; font-size: 13px; line-height: 1.35; color: var(--ink); }
  .row.sel .t b { font-weight: 600; }
  .row.unloaded .t b { color: var(--ink-2); }
  .t small { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.unloaded .ic { opacity: .7; filter: saturate(.7); }
  .st { display: grid; place-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.unread { background: var(--mint); box-shadow: 0 0 6px rgba(143,227,196,.5); }
  .dot.ask { background: var(--peach); box-shadow: 0 0 6px rgba(255,179,138,.5); }
  .dots { display: flex; gap: 2px; }
  .dots i { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-2); animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  .foot { display: flex; align-items: center; gap: 2px; padding: 6px 10px; border-top: 1px solid rgba(255,255,255,.04); }
  .foot .sp { flex: 1; }
  .undo { font-size: 12px; color: var(--ink-2); display: none; align-items: center; gap: 6px; padding: 0 6px; }
  .undo.show { display: flex; }
  .undo button { border: 0; background: none; color: var(--peach); font: 600 12px var(--ui); cursor: pointer; padding: 0; }

  /* chat */
  .main { display: flex; flex-direction: column; min-height: 0; }
  .scroll { flex: 1; overflow-y: auto; }
  .col { max-width: 720px; margin: 0 auto; padding: 28px 28px 12px; display: grid; gap: 18px; }
  .you { justify-self: end; max-width: 82%; background: var(--raise); border-radius: 14px 14px 4px 14px; padding: 9px 13px; }
  .ai p { margin: 0 0 10px; }
  .ai code { font: 12.5px var(--mono); color: #ffc9a8; background: rgba(255,179,138,.1); padding: 1px 5px; border-radius: 4px; }
  .tools { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 12.5px; margin-bottom: 10px; }
  .tools svg { width: 14px; height: 14px; }
  .tools hr { flex: 1; border: 0; border-top: 1px solid var(--line); }

  .dock { padding: 6px 28px 16px; }
  .composer { max-width: 760px; margin: 0 auto; }
  .field { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 18px; padding: 10px 10px 10px 16px; box-shadow: 0 0 0 1px var(--line), 0 18px 40px -18px rgba(0,0,0,.6); }
  .field input { flex: 1; border: 0; outline: 0; background: none; color: var(--ink); font: 15px var(--ui); }
  .field input::placeholder { color: var(--ink-3); }
  .ring { width: 36px; height: 36px; position: relative; display: grid; place-items: center; }
  .ring > svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring b { width: 26px; height: 26px; border-radius: 50%; background: var(--peach); display: grid; place-items: center; color: #3a1f10; opacity: .5; }
  .under { display: flex; gap: 16px; padding: 6px 14px 0; font-size: 11.5px; color: var(--ink-2); align-items: center; }
  .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-right: 6px; vertical-align: -1px; }
  .bars i { width: 3px; border-radius: 1px; background: rgba(148,138,169,.45); }
  .bars i.on { background: var(--peach); }

  .note { position: absolute; right: 18px; bottom: 120px; width: 230px; font-size: 12px; color: var(--ink-2); background: rgba(47,40,67,.92); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
  .note b { color: var(--ink); font-weight: 600; }
  .note kbd { font: 11px var(--ui); color: var(--peach); }
</style>
</head>
<body>
<div class="win" id="win">
  <header class="top">
    <div class="left">
      <div class="lights"><i></i><i></i><i></i></div>
      <button class="ib on" id="toggle" title="Hide inbox (⌘S)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/></svg></button>
      <button class="ib" title="Files"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 4.5v8h11v-6.5H8L6.5 4.5z"/></svg></button>
      <div class="room" title="Switch project"><span id="room">pig</span><svg class="chev" viewBox="0 0 8 8" fill="currentColor"><path d="M1 2.5h6L4 6z"/></svg></div>
    </div>
    <div class="title" id="title"></div>
    <div class="right">
      <button class="ib" title="Go to anything (⌘K)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></button>
      <button class="ib" title="Extensions & Resources"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2.5h4v3h3v4h-3v4H6v-4H3v-4h3z"/></svg></button>
      <button class="ib" title="Terminal"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="m5 7 2 1.5L5 10M8.5 10.5H11"/></svg></button>
      <button class="ib" title="Session tree"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="4" cy="3.5" r="1.5"/><circle cx="4" cy="12.5" r="1.5"/><circle cx="12" cy="6" r="1.5"/><path d="M4 5v6M12 7.5c0 2.5-3 3-8 3.5"/></svg></button>
      <button class="ib" title="Custom actions"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.5 2.5 13.5 5.5 6 13H3v-3z"/></svg></button>
    </div>
  </header>

  <aside class="inbox">
    <div class="inbox-inner">
      <button class="new" title="New chat (⌘N)"><span class="plus"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg></span>New chat<kbd>⌘N</kbd></button>
      <div class="list" id="list"></div>
      <div class="foot">
        <button class="ib" title="Settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
        <div class="undo" id="undo"><span id="undo-text"></span><button id="undo-btn">Undo</button></div>
        <span class="sp"></span>
        <button class="ib" title="All sessions and archive (⌘F)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="3" rx="1"/><path d="M3 6v7h10V6M6.5 9h3"/></svg></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="scroll"><div class="col" id="chat"></div></div>
    <div class="dock">
      <div class="composer">
        <div class="field">
          <input placeholder="Message…">
          <div class="ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="none" stroke="#433a58" stroke-width="2.5"/><circle id="ring" cx="18" cy="18" r="16" fill="none" stroke="#8fe3c4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="62"/></svg><b><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></b></div>
        </div>
        <div class="under"><span>GPT-6.1 Sol</span><span><span class="bars"><i class="on" style="height:4px"></i><i class="on" style="height:6px"></i><i class="on" style="height:8px"></i><i style="height:10px"></i><i style="height:12px"></i></span>Medium</span></div>
      </div>
    </div>
  </main>

  <div class="note" id="note"><b>Try it</b><br>Click rows to switch. Drag a row left to mark it done, or select it and press <kbd>Delete</kbd>. Drag rows to reorder. <kbd>⌘S</kbd> hides the inbox.</div>
</div>

<script>
  // Pixel art: folder per project color, faces for agents, bolt for quick chats.
  const FOLDER = ["............",".tttt.......","tttttt......","tllllllllllt","tbbbbbbbbbbt","tbbbbbbbbbbt","tbbbbbbbbbbt","tbbbbbbbbbst","tsbbbbbbbsst","dddddddddddd","............","............"];
  const BOLT = ["............","......ooo...",".....ohyo...","....ohyo....","...ohyo.....","..ohyyyyyo..","..oooyyyo...","....oyyo....","...oyyo.....","...oyo......","...oo.......","............"];
  const FACE = ["..hhhhhh..",".hhhhhhhh.",".hssssssh.",".sesssess.",".ssssssss.","..ssmmss..","...ssss...","..cccccc..",".cccccccc.","cccccccccc"];
  const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
  const css = ([r,g,b]) => `rgb(${r|0},${g|0},${b|0})`;
  const shade = (c, f) => c.map(v => Math.min(255, v * f));
  const mixW = (c, t) => c.map(v => v + (255 - v) * t);

  function sprite(map, pal, tint, pad) {
    const n = map.length, w = map[0].length;
    let r = "";
    map.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) r += `<rect x="${x}" y="${y}" width="1.04" height="1.04" fill="${pal[ch]}"/>`; }));
    return `<svg class="ic" viewBox="${-pad} ${-pad} ${w + pad * 2} ${n + pad * 2}" shape-rendering="crispEdges" style="background:${tint}">${r}</svg>`;
  }
  function icon(kind, color, look) {
    if (kind === "folder") {
      const b = hex(color);
      return sprite(FOLDER, { t: css(shade(b,.72)), l: css(mixW(b,.38)), b: css(b), s: css(shade(b,.86)), d: css(shade(b,.55)) }, `rgba(${b},.18)`, 1.6);
    }
    if (kind === "bolt") {
      const b = hex("#ffb703");
      return sprite(BOLT, { y: css(b), h: css(mixW(b,.5)), o: css(shade(b,.5)) }, "rgba(255,183,3,.16)", 1.6);
    }
    return sprite(FACE, { h: look.hair, s: look.skin, e: "#211a2e", m: "#b85a6a", c: look.shirt }, look.shirt + "38", 0);
  }

  const P = { pig: "#c78bf2", AF_MCP: "#f2d36b", Purchasing: "#f28bb3", Bible_App: "#7fb6f2", ".pi": "#7ff2a4" };
  let chats = [
    { id: 1, title: "Restyle the inbox for the cast layout", sub: "pig", kind: "folder", color: P.pig, status: "working", loaded: true,
      chat: `<div class="you">Identifying sessions from faces in the top bar isn't working. Can the inbox come back?</div>
             <div class="ai"><div class="tools"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="m5 7 2 1.5L5 10"/></svg>Tool activity 4<hr></div>
             <p>Yes. The list returns on the left with each chat's pixel folder or agent face, a two-line title, and its status. Swipe, drag, and undo come back from the old <code>InboxSessionListRow</code>.</p>
             <p>The top bar keeps the project, files, and controls, and the open chat's title moves to its center.</p></div>` },
    { id: 2, parent: 1, title: "Review the restored swipe gesture", sub: "subagent", kind: "folder", color: P.pig, status: "unread", loaded: true,
      chat: `<div class="ai"><p>The swipe handler works unchanged once it's hosted in the new row view. Working rows still refuse Done.</p></div>` },
    { id: 3, title: "Unauthenticated endpoint URL retrieval", sub: "AF_MCP", kind: "folder", color: P.AF_MCP, status: "", loaded: true,
      chat: `<div class="you">Which endpoints answer without a token?</div><div class="ai"><p>Three: <code>/health</code>, <code>/version</code>, and <code>/books</code>. The last one should require auth.</p></div>` },
    { id: 4, title: "Create Duplo purchase requisition spreadsheet", sub: "Emma", kind: "face", look: { hair: "#efe0b9", skin: "#fbd9bf", shirt: "#8ab17d" }, status: "ask", loaded: true,
      chat: `<div class="ai"><p>The requisition is drafted. Should I send it to purchasing now?</p></div>` },
    { id: 5, title: "Fix Hermes auth storage and inbox message display", sub: "pig", kind: "folder", color: P.pig, status: "", loaded: false,
      chat: `<div class="ai"><p>Tokens now live in the Keychain, and the inbox shows the latest message preview.</p></div>` },
    { id: 6, title: "Anthropic models reappearing after logout", sub: ".pi", kind: "folder", color: P[".pi"], status: "unread", loaded: false,
      chat: `<div class="ai"><p>The cause is <code>pi-claude-auth</code>, which re-seeds the credential every five minutes.</p></div>` },
    { id: 7, title: "Weekly sales summary for October", sub: "Purchasing", kind: "folder", color: P.Purchasing, status: "", loaded: false,
      chat: `<div class="ai"><p>October closed 12% over September, led by the devotional reprint.</p></div>` },
    { id: 8, title: "How long to steep oolong", sub: "Quick chat", kind: "bolt", status: "", loaded: true,
      chat: `<div class="you">How long should I steep oolong?</div><div class="ai"><p>Three to five minutes at about 90°C. It holds up to several infusions.</p></div>` },
  ];
  let selected = 1;
  let lastDone = null;

  const list = document.getElementById("list");
  const statusHTML = s => s === "working" ? `<span class="dots"><i></i><i></i><i></i></span>` : s ? `<span class="dot ${s}"></span>` : "";

  function render() {
    list.innerHTML = "";
    chats.forEach(c => {
      const row = document.createElement("div");
      row.className = `row${c.parent ? " child" : ""}${c.id === selected ? " sel" : ""}${c.loaded ? "" : " unloaded"}`;
      row.dataset.id = c.id;
      row.draggable = true;
      row.tabIndex = 0;
      row.innerHTML = `<div class="done-bg"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="m3.5 8.5 3 3 6-7"/></svg>Done</div>
        <div class="face">${icon(c.kind, c.color, c.look)}<div class="t"><b>${c.title}</b>${c.parent ? "" : `<small>${c.sub}</small>`}</div><div class="st">${statusHTML(c.id === selected && c.status === "working" ? "" : c.status)}</div></div>`;
      list.appendChild(row);
      wire(row, c);
    });
    const cur = chats.find(c => c.id === selected);
    document.getElementById("title").innerHTML = cur ? `${icon(cur.kind, cur.color, cur.look)}<span>${cur.title}</span>` : "";
    document.getElementById("room").textContent = cur ? (cur.kind === "bolt" ? "Quick chat" : cur.kind === "face" ? cur.sub : cur.parent ? "pig" : cur.sub) : "pig";
    document.getElementById("chat").innerHTML = cur ? cur.chat : "";
  }

  function select(c) {
    selected = c.id;
    if (c.status === "unread") c.status = "";
    c.loaded = true;
    render();
  }

  function markDone(c) {
    if (c.status === "working") return;
    const removed = chats.filter(x => x.id === c.id || x.parent === c.id);
    const index = chats.indexOf(c);
    chats = chats.filter(x => !removed.includes(x));
    lastDone = { removed, index };
    if (removed.some(x => x.id === selected)) selected = chats[Math.min(index, chats.length - 1)]?.id;
    document.getElementById("undo-text").textContent = `Done: ${c.title.slice(0, 22)}${c.title.length > 22 ? "…" : ""}`;
    document.getElementById("undo").classList.add("show");
    render();
  }

  document.getElementById("undo-btn").onclick = () => {
    if (!lastDone) return;
    chats.splice(lastDone.index, 0, ...lastDone.removed);
    selected = lastDone.removed[0].id;
    lastDone = null;
    document.getElementById("undo").classList.remove("show");
    render();
  };

  let dragID = null;
  function wire(row, c) {
    const face = row.querySelector(".face");
    // Swipe left to reveal Done; past 60% completes.
    let startX = null, dx = 0, moved = false;
    face.addEventListener("pointerdown", e => { if (e.button) return; startX = e.clientX; dx = 0; moved = false; });
    window.addEventListener("pointermove", e => {
      if (startX === null) return;
      dx = Math.min(0, e.clientX - startX);
      if (Math.abs(dx) > 6 && !moved) { moved = true; row.draggable = false; face.setPointerCapture?.(e.pointerId); }
      if (moved && c.status !== "working") {
        face.style.transition = "none";
        face.style.transform = `translateX(${dx}px)`;
        row.classList.toggle("commit", -dx > row.offsetWidth * .6);
      }
    });
    window.addEventListener("pointerup", () => {
      if (startX === null) return;
      startX = null;
      face.style.transition = "";
      if (moved && -dx > row.offsetWidth * .6) { markDone(c); return; }
      face.style.transform = moved && -dx > 40 ? "translateX(-78px)" : "";
      row.draggable = true;
      if (!moved) select(c);
    });
    row.addEventListener("keydown", e => { if (e.key === "Backspace" || e.key === "Delete") markDone(c); });
    row.querySelector(".done-bg").addEventListener("click", () => markDone(c));

    // Drag to reorder: roots among roots, children among siblings.
    row.addEventListener("dragstart", e => { dragID = c.id; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
    row.addEventListener("dragend", () => { dragID = null; render(); });
    row.addEventListener("dragover", e => {
      const d = chats.find(x => x.id === dragID);
      if (!d || d.id === c.id || (d.parent || 0) !== (c.parent || 0)) return;
      e.preventDefault();
      const after = e.offsetY > row.offsetHeight / 2;
      row.classList.toggle("drop-after", after);
      row.classList.toggle("drop-before", !after);
    });
    row.addEventListener("dragleave", () => row.classList.remove("drop-after", "drop-before"));
    row.addEventListener("drop", e => {
      e.preventDefault();
      const d = chats.find(x => x.id === dragID);
      const after = row.classList.contains("drop-after");
      const group = chats.filter(x => x === d || x.parent === d.id);
      chats = chats.filter(x => !group.includes(x));
      let at = chats.indexOf(c);
      if (after) { at++; while (chats[at] && chats[at].parent === c.id) at++; }
      chats.splice(at, 0, ...group);
      render();
    });
  }

  const win = document.getElementById("win");
  const toggle = () => { win.classList.toggle("collapsed"); document.getElementById("toggle").classList.toggle("on"); };
  document.getElementById("toggle").onclick = toggle;
  window.addEventListener("keydown", e => { if (e.metaKey && e.key === "s") { e.preventDefault(); toggle(); } });
  render();
</script>
</body>
</html>
